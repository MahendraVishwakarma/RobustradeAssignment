name: iOS CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail

          simulator_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"

          if [[ -z "$simulator_id" ]]; then
            echo "No available iPhone simulator was found."
            xcrun simctl list devices available
            exit 1
          fi

          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          xcodebuild test \
            -project eShop.xcodeproj \
            -scheme eShop \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            CODE_SIGNING_ALLOWED=NO
